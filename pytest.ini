[pytest]
# run tests in utc (same as ci/cd when I have it)
env =
    TZ=UTC

# Explicitly list the top-level directories containing tests
testpaths =
   tests

norecursedirs =
    *.egg-info
    .git
    .pytest_cache
    .uv
    .venv
    build
    dist
    node_modules

# Ensure pytest recognizes the root for imports
pythonpath = src

# Optional but helpful: standardizes test discovery
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers -v