[tool.poetry]
version = "0.1.0"
requires-poetry = '>=2.0'

[tool.poetry.group.dev.dependencies]
pytest = "^5.2"

[package]
include = ["src/**"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "src" #needs to match the folder name
description = ""
dynamic = ["version"]
readme = 'README.md'
authors = [{name = "@baumannalexj"}]
requires-python = '>=3.9,<4.0'
dependencies = [
    'requests>=2.26.0,<3.0.0',
    'requests-oauthlib>=1.3.0,<2.0.0',
    "boto3 (>=1.42.39,<2.0.0)"
]

[project.urls]
repository = "https://github.com/baumannalexj/twitter-wednesday-bot"
