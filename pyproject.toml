[project]
name = "twitter-wednesday-bot"
version = "0.2.0"
description = ""
readme = "README.md"
authors = [{name = "alexander baumann", email = "baumannalexj@gmail.com"}]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.3",
    "requests-oauthlib>=1.3.0",
]

[project.urls]
repository = "https://github.com/baumannalexj/twitter-wednesday-bot"

[dependency-groups]
dev = [
    "pytest>=5.2",
    "ruff>=0.15.12",
    "pyright>=1.1.380",
    "boto3-stubs[lambda]>=1.43.2",
    "aws-lambda-typing>=2.20.0",
    "freezegun>=1.5.5",
    "pytest-env>=1.6.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/clients",
    "src/app_isitwednesday_post",
    "src/app_isitwednesday_reply",
]

######## typing


[tool.mypy]
plugins = ["mypy_boto3"]
check_untyped_defs = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"  # or "standard" / "basic"

[tool.coverage.run]
omit = ["tests/*"]
######## LINTING

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.format]
# Honors the "magic trailing comma": a trailing comma after the last arg
# forces the call/signature multi-line. Use trailing commas on calls with
# 2+ args; calls with 0–1 args stay single-line.
skip-magic-trailing-comma = false

#### END LINTING