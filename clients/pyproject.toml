[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clients"
version = "0.1.0"
requires-python = ">=3.9,<4.0"
dependencies = [
    "requests>=2.26.0,<3.0.0",
    "requests-oauthlib>=1.3.0,<2.0.0",
    "boto3>=1.42.39,<2.0.0",
]

[tool.setuptools]
packages = ["clients", "clients.twitter", "clients.twitter.responses", "clients.aws"]

[tool.setuptools.package-dir]
"clients" = "src"
