[project]
name = "clients"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.26.0",
    "requests-oauthlib>=1.3.0",
    "boto3>=1.0.0",
]

[dependency-groups]
dev = ["boto3-stubs[ssm]~=1.43.2"]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clients"]
