name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Install pytest-md
        run: uv add --dev pytest-md

      - name: Test
        run: uv run pytest --md=/tmp/pytest-report.md --cov=src --cov-report=term-missing --cov-fail-under=90

      - name: Test summary
        if: always()
        run: cat /tmp/pytest-report.md >> $GITHUB_STEP_SUMMARY
